name: Prebuilts

# Builds swift-winui once on a Windows runner and publishes the result as a
# SwiftPM artifact bundle, so downstream packages do not have to recompile the
# ~317 generated WinRT projection sources on every cold build.
#
# The Swift module format is not stable across compiler versions, so a bundle is
# only usable by the exact Swift release it was produced with. The toolchain
# version is therefore part of the release tag and of the asset name.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to record in info.json and in the release tag"
        required: true
        default: "0.2.2"
      publish:
        description: "Create/update a GitHub release with the bundle"
        type: boolean
        default: false
  push:
    tags:
      - "prebuilt-*"

permissions:
  contents: write

env:
  # SE-0482 `staticLibrary` artifact bundles need Swift 6.2+, and the
  # `experimentalWindowsDLL` artifact type needs 6.3+. A toolchain older than
  # that fails to decode info.json and reports the bundle as containing no
  # binary artifact at all.
  SWIFT_BRANCH: swift-6.3.1-release
  SWIFT_TAG: 6.3.1-RELEASE

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        # bash is not supported by gha-setup-swift:
        # https://github.com/compnerd/gha-setup-swift/issues/18#issuecomment-1705524890
        shell: pwsh

    steps:
      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@v5

      - name: Setup Swift
        uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: ${{ env.SWIFT_BRANCH }}
          tag: ${{ env.SWIFT_TAG }}

      - name: Swift version
        run: swift --version

      - uses: actions/checkout@v4

      - name: Resolve version
        id: vars
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^prebuilt-','' }
          if (-not $v) { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "triple=x86_64-unknown-windows-msvc" >> $env:GITHUB_OUTPUT
          "swifttag=${{ env.SWIFT_TAG }}" >> $env:GITHUB_OUTPUT

      # Compiling the projections is the expensive step (~13 min); cache it so
      # that iterating on packaging does not pay for it every time.
      - name: Restore build cache
        id: buildcache
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: winui-build-${{ env.SWIFT_TAG }}-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: winui-build-${{ env.SWIFT_TAG }}-

      # SWIFT_WINUI_AGGREGATE makes Package.swift expose a single static library
      # product covering every target, so the whole package archives into one lib.
      - name: Build aggregate static library
        env:
          SWIFT_WINUI_AGGREGATE: "1"
        run: swift build -c release --product SwiftWinUIAggregate

      # Saved separately, and unconditionally, so that a failure in a later
      # packaging step does not throw away the ~13 minute compile.
      - name: Save build cache
        if: always() && steps.buildcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build
          key: winui-build-${{ env.SWIFT_TAG }}-${{ hashFiles('Package.swift', 'Sources/**') }}

      - name: List build products
        env:
          SWIFT_WINUI_AGGREGATE: "1"
        run: |
          $bin = swift build -c release --show-bin-path
          "binpath=$bin" >> $env:GITHUB_OUTPUT
          Write-Host "--- $bin ---"
          Get-ChildItem $bin -File | Format-Table Name, Length | Out-String | Write-Host
          Write-Host "--- Modules ---"
          Get-ChildItem (Join-Path $bin "Modules") | Format-Table Name, Length | Out-String | Write-Host
        id: bin

      - name: Assemble artifact bundle
        run: |
          ./Scripts/make-artifact-bundle.ps1 `
            -BuildDir "${{ steps.bin.outputs.binpath }}" `
            -Triple "${{ steps.vars.outputs.triple }}" `
            -OutDir "$env:RUNNER_TEMP/out" `
            -Version "${{ steps.vars.outputs.version }}"

      - name: Zip and checksum
        id: pack
        run: |
          $name = "swift-winui-${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.triple }}-${{ steps.vars.outputs.swifttag }}.artifactbundle.zip"
          $zip = Join-Path $env:RUNNER_TEMP $name
          Compress-Archive -Path "$env:RUNNER_TEMP/out/swift-winui.artifactbundle" -DestinationPath $zip
          # SwiftPM validates a remote binaryTarget against this checksum.
          $sum = (swift package compute-checksum $zip).Trim()
          Write-Host "checksum: $sum"
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "checksum=$sum" >> $env:GITHUB_OUTPUT

      # Proves the bundle is consumable before anything is published. This goes
      # through the real manifest (SWIFT_WINUI_PREBUILT pointing at the freshly
      # built bundle), as a separate package depending on swift-winui, which is
      # exactly the shape of a downstream consumer such as swift-cross-ui.
      - name: Verify a consumer builds against the bundle
        env:
          # A local binaryTarget path must be relative to its own package root,
          # so the bundle is staged inside the swift-winui checkout.
          SWIFT_WINUI_PREBUILT: swift-winui.artifactbundle
        run: |
          Copy-Item -Recurse -Force `
            "$env:RUNNER_TEMP/out/swift-winui.artifactbundle" `
            "$env:GITHUB_WORKSPACE/swift-winui.artifactbundle"
          $c = Join-Path $env:RUNNER_TEMP "consumer"
          if (Test-Path $c) { Remove-Item $c -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "$c/Sources/Probe" | Out-Null
          @"
          // swift-tools-version: 5.10
          import PackageDescription
          let package = Package(
              name: "Consumer",
              dependencies: [.package(path: #"$($env:GITHUB_WORKSPACE)"#)],
              targets: [
                  .target(name: "Probe", dependencies: [
                      .product(name: "WinUI", package: "swift-winui"),
                      .product(name: "UWP", package: "swift-winui"),
                      .product(name: "WinAppSDK", package: "swift-winui"),
                      .product(name: "WindowsFoundation", package: "swift-winui"),
                      .product(name: "WebView2Core", package: "swift-winui"),
                      .product(name: "CWinRT", package: "swift-winui"),
                  ]),
              ]
          )
          "@ | Set-Content "$c/Package.swift" -Encoding utf8
          @'
          import WinUI
          import UWP
          import WinAppSDK
          import WindowsFoundation
          import WebView2Core
          import CWinRT

          // Touch a symbol from each projection so every module really has to
          // load, and so the static archive really has to resolve at link time.
          public func probe() -> [String] {
              [
                  String(describing: WinUI.Button.self),
                  String(describing: UWP.ApplicationDataSetVersionHandler.self),
                  String(describing: WinAppSDK.WindowsAppRuntimeInitializer.self),
                  String(describing: WebView2Core.CoreWebView2.self),
                  String(describing: (any WindowsFoundation.IReference).self),
              ]
          }
          '@ | Set-Content "$c/Sources/Probe/Probe.swift" -Encoding utf8
          Push-Location $c
          swift build
          Pop-Location

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: swift-winui-artifactbundle
          path: ${{ steps.pack.outputs.zip }}

      - name: Write consumption instructions
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/prebuilt-${{ steps.vars.outputs.version }}/${{ steps.pack.outputs.name }}"
          @"
          ## Prebuilt swift-winui

          | | |
          |---|---|
          | version | ``${{ steps.vars.outputs.version }}`` |
          | triple | ``${{ steps.vars.outputs.triple }}`` |
          | toolchain | ``${{ steps.vars.outputs.swifttag }}`` |
          | checksum | ``${{ steps.pack.outputs.checksum }}`` |

          The Swift module format is tied to the compiler version: this bundle is
          only usable with Swift ${{ steps.vars.outputs.swifttag }}.

          ``````swift
          .binaryTarget(
              name: "SwiftWinUIPrebuilt",
              url: "$url",
              checksum: "${{ steps.pack.outputs.checksum }}"
          )
          ``````
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release
        if: ${{ github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/prebuilt-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "prebuilt-${{ steps.vars.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Prebuilt swift-winui for ${{ steps.vars.outputs.triple }}, Swift ${{ steps.vars.outputs.swifttag }}. checksum: ${{ steps.pack.outputs.checksum }}"
          }
          gh release upload $tag "${{ steps.pack.outputs.zip }}" --clobber
